[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true
fs_permissions = [
  { access = "read-write", path = "../runs" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
